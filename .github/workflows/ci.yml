name : Continues Integration pipeline
on:
  push:
    branches:["main","master"]
  pull_request:
    branches:["main","master"]

jobs:
  test:
    name: Run Test Suite & Quality checks
    runs-on: ubuntu-latest

    steps:
    -name: Checkout repository code into the runner
     uses: actions/checkout@v3 

    -name: Set up python 3.10
     uses: action/setup-python@v4
     with:
        python-version: "3.10"
        cache:'pip'


    -name: Install Dependencies
     run: |
       python -m pip install --upgrade pip
       if [-f requirements.txt]; then pip install -r requirements.txt;fi 

    -name: Lint code with Flake8
     run: |
       flake8 .--count --select=E9,F63,F7,F82 --show-source --statistics
       flake8 .--count --exit-zero --max-complexity=10 --max-line-length=100 --sta



    -name: Execute pytest Suite
     run: |
       python -m pytest --cov=src --cov=app  --cov-fail-under=80 --cov-report=term-missing

