name: ci.yml

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3 

    - name: Set up python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt 

    - name: Lint code with Flake8
      run: flake8 src/

    - name: Run pytest Suite
      run: pytest --cov=src --cov=app --cov-fail-under=80

  build-scan-push-container:
    needs: test
    # This ensures container building only runs on pushes to main, or PRs being merged
    if: github.ref == 'refs/heads/main' || github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata
        id: meta 
        uses: docker/metadata-action@v4
        with:
          images: ghcr.io/karo46765-spec/my-first-ml-project
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short
            type=ref,event=tag

      - name: Build and Push Container images
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: credit-scoring-api:local

      - name: Run Trivy Security Vulnerability scan 
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'credit-scoring-api:local'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
          trivyignores: .trivyignore
      - name: Push container Image to ghcr
        uses: docker/build-push-action@v4
        with:
          Context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.output.tags }}
          labels: ${{ steps.meta.outputs.labels }}