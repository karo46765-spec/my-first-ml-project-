version: 1.0
runtime: image
build:
  commands:
    pre-run:
      - echo "Starting Credit Scoring Microservise..."

run:
  command: uvicorn app:app --host 0.0.0.0 --port 8000
  network:
    port: 8000
    env: PORT 
  env:
    - name: APP_ENV
      value: "production"
    - name: LOG_LEVEL
      value: "info"
    - name: MODEL_PATH
      value: "src/model.pkl"
  health-check:
    protocol: HTTP
    path: /
    interval: 10
    timeout: 5
    healthy-threshold: 2
    unhealthy-threshold: 3