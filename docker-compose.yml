version: '3.8'

services:
  credit-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: credit_scoring_microservice
    ports:
      - "8000:8000"
    enviornment:
      - APP_ENV=production
      - LOG_LEVEL=info
    restart: always
    healthcheck:
      test: ["CMD-SHELL","curl -f http://localhost:8000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3